name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint the code
        run: |
          pip install flake8
          flake8 . --ignore=E501 --ignore=E262 --exclude=.git,__pycache__

      - name: Smoke test imports
        run: |
          python -c "import scanner"
          python -c "import config"
          python -c "import prompts"
          python -c "import summarizer"
